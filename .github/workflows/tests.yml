name: Pipeline unit tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Airflow environment
        run: docker build -t music-test .
      - name: Test transformation and GX gates
        run: docker run --rm --entrypoint python -e PYTHONPATH=/work -v "$PWD:/work" -w /work music-test -m pytest -q tests
